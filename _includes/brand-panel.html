<!-- Bouton hamburger fixe dans le layout -->
  <button type="button" class="mobile-menu-btn" aria-label="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

<aside class="brand-panel {% if page.layout == 'home' or page.url == '/' or page.url == '/index.html' %}full{% else %}side{% endif %}">

<a href="{{ '/' | relative_url }}" class="logo">
  <img src="{{ '/assets/img/Portrait1.png' | relative_url }}" decoding="sync" loading="eager">
</a>
  <h1 class="site-title">{{ site.title }}</h1>
  <p class="site-tagline">{{ site.description }}</p>

<nav>
    <ul class="nav-menu">
      <li><a href="{{ '/savoir-faire/' | relative_url }}" class="custom-tooltip-right" data-tooltip="Découvrez mes compétences et mon savoir-faire"><span>Savoir-faire</span></a></li>
      <li><a href="{{ '/mon-parcours/' | relative_url }}" class="custom-tooltip-right" data-tooltip="Découvrez mon parcours professionnel"><span>Mon parcours</span></a></li>

      <li class="has-submenu {% if page.url contains 'graphisme' or page.url contains 'motion' or page.url contains 'photo' or page.url contains 'portfolio' %}open{% endif %}">
        <button type="button" class="submenu-toggle">
          <span>Portfolio</span> <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <ul class="submenu">
          <li><a href="{{ '/graphismes/' | relative_url }}" class="custom-tooltip-right" data-tooltip="Découvrez mes créations graphiques et travaux d'édition."><span>Graphismes</span></a></li>
          <li><a href="{{ '/motion-design/' | relative_url }}" class="custom-tooltip-right" data-tooltip="Découvrez mes projets de Motion Design"><span>Motion Design</span></a></li>
          <li><a href="{{ '/photos/' | relative_url }}" class="custom-tooltip-right" data-tooltip="Découvrez mes photographies"><span>Photographies</span></a></li>
        </ul>
      </li>
    </ul>
  </nav>

<div class="social-links">
    <a href="https://github.com/arnaud-pinot"  class="external-link custom-tooltip" data-tooltip="Visitez mon Github" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    <a href="https://www.linkedin.com/in/arnaud-pinot/" class="external-link custom-tooltip" data-tooltip="Mon linkedin" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
    <a href="#" aria-label="Mastodon"><i class="fa-brands fa-mastodon"></i></a>
    <a href="{{ '/cv.html' | relative_url }}"  class="external-link custom-tooltip" data-tooltip="Téléchargez mon CV au format PDF" aria-label="Mon CV">  <i class="fa-solid fa-file-lines"></i></a>
    <a href="#" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
  </div>


</aside>
